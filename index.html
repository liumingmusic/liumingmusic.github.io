<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fc" id="theme-color-meta" />
  <title>应用中心 · liumingmusic</title>
  <meta name="description" content="精选小应用合集，点击即可体验。纯静态、免安装、即开即用。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%EF%B8%BC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 背景层 -->
  <div class="bg-layer" aria-hidden="true"></div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="site-logo" href="./" aria-label="首页">
        <span class="logo-icon">✦</span>
        <span class="logo-text">应用中心</span>
      </a>
      <div class="topbar-right">
        <button class="search-trigger" id="search-trigger" type="button" aria-label="搜索应用">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>搜索</span>
        </button>
        <button class="theme-btn" id="theme-toggle" type="button" aria-label="切换主题"></button>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main-wrap">

    <!-- Hero -->
    <section class="hero">
      <h1 class="hero-title" id="hero-title">我的小应用</h1>
      <p class="hero-desc" id="hero-desc">精选工具与应用，点击即可体验，无需注册安装</p>
      <div class="hero-search" id="hero-search" role="search">
        <svg class="hs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="hs-input" id="hs-input" type="text" placeholder="搜索应用…" autocomplete="off" spellcheck="false" />
        <kbd class="hs-kbd">/</kbd>
      </div>
    </section>

    <!-- 分类筛选 -->
    <nav class="cat-bar" id="cat-bar" aria-label="分类筛选"></nav>

    <!-- 应用卡片网格 -->
    <section class="grid" id="app-grid" aria-label="应用列表"></section>

  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <span>Powered by GitHub Pages · 纯静态站点</span>
  </footer>

  <!-- 命令面板（搜索） -->
  <div class="cmd-overlay" id="cmd-overlay" hidden>
    <div class="cmd-panel" role="dialog" aria-modal="true" aria-label="搜索应用">
      <div class="cmd-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--text3)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="cmd-input" id="cmd-input" type="text" placeholder="搜索应用名称、描述或标签…" autocomplete="off" spellcheck="false" />
        <button class="cmd-close" id="cmd-close" type="button">Esc</button>
      </div>
      <ul class="cmd-results" id="cmd-results"></ul>
      <div class="cmd-hint"><kbd>↑↓</kbd> 选择 &nbsp; <kbd>Enter</kbd> 打开 &nbsp; <kbd>Esc</kbd> 关闭</div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
